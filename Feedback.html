        <main class="main-panel page-content">
            <div class="form-container">
                <h1>Feedback Form</h1>
        
                <form id="feedbackForm">
            <div class="input-group">
                <label for="name">Name:</label>
                        <input type="text" id="name" name="name" placeholder="Your account name" readonly required>
            </div>

            <div class="input-group">
                <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Your account email" readonly required>
            </div>

            <div class="input-group">
                <label for="subject">Subject:</label>
                        <input type="text" id="subject" name="subject" maxlength="160" placeholder="Enter subject" required>
            </div>

            <div class="input-group">
                <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" maxlength="5000" placeholder="Enter message" required></textarea>
            </div>

                    <p id="feedbackStatus" role="status" aria-live="polite"></p>
                    <button id="feedbackSubmit" type="submit" class="submit-btn" disabled>
                Submit <span>&rarr;</span>
            </button>
        </form>
            </div>
        </main>
    </div>
    <script src="JavaScript Files/Feedback.js" defer></script>
